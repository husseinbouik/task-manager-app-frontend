# Render Blueprint — Task Manager frontend (free static site)
# Deploy: Render Dashboard -> New -> Blueprint -> connect this repo -> Apply.
# REACT_APP_API_URL is baked in at build time; it assumes the backend
# service is named "task-manager-api". If the backend hostname differs,
# update this value in the dashboard and redeploy the static site.
services:
  - type: web
    name: task-manager-web
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://task-manager-api.onrender.com/api
      - key: CI
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
